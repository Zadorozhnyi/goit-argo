apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  namespace: application
  labels:
    app: demo-nginx
  annotations:
    gitops-demo: "changed-by-git-push"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # Nodes are t3.small, so the demo has to stay small too.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nginx
  namespace: application
  labels:
    app: demo-nginx
spec:
  type: ClusterIP
  selector:
    app: demo-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
