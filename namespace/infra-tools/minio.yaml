apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-minio
  namespace: infra-tools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 17.0.21
    helm:
      valuesObject:
        # Bitnami emptied the `bitnami/*` tags for minio images (Aug 2025
        # catalog restructuring); the frozen versions live under bitnamilegacy.
        global:
          security:
            allowInsecureImages: true
        image:
          repository: bitnamilegacy/minio
        clientImage:
          repository: bitnamilegacy/minio-client
        auth:
          rootUser: admin
          rootPassword: mlflowpass
        defaultBuckets: "mlflow-artifacts"
        persistence:
          enabled: false
        tls:
          enabled: false
        service:
          type: ClusterIP
          ports:
            api: 9000
        # Avoids also needing bitnamilegacy/minio-object-browser; the console
        # isn't required for this assignment (bucket + S3 API only).
        console:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mlops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
