apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-minio
  namespace: infra-tools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 17.0.21
    helm:
      valuesObject:
        auth:
          rootUser: admin
          rootPassword: mlflowpass
        defaultBuckets: "mlflow-artifacts"
        persistence:
          enabled: false
        tls:
          enabled: false
        service:
          type: ClusterIP
          ports:
            api: 9000
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mlops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
